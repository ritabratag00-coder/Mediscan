<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan AI - Advanced Medical Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-cyan: #00f0ff;
            --primary-blue: #0066ff;
            --accent-pink: #ff006e;
            --accent-purple: #7b2ff7;
            --bg-dark: #0a0e1a;
            --bg-darker: #050812;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-cyan), transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            bottom: -150px;
            right: -150px;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-pink), transparent);
            top: 50%;
            left: 50%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, -100px) scale(1.1); }
            66% { transform: translate(-100px, 100px) scale(0.9); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-cyan), transparent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        /* Input Section */
        .input-section {
            flex: 1;
            min-width: 400px;
            animation-delay: 0.2s;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-cyan);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-left: 20px;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-cyan), var(--accent-purple));
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Scan Button */
        .scan-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .scan-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .scan-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.5);
        }

        .scan-btn:active {
            transform: translateY(0);
        }

        .scan-btn span {
            position: relative;
            z-index: 1;
        }

        /* Results Section */
        .results-section {
            flex: 1;
            min-width: 600px;
            animation-delay: 0.4s;
        }

        .results-panel {
            display: none;
        }

        .results-panel.active {
            display: block;
            animation: slideInRight 0.6s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Scanning Animation */
        .scanning-animation {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .scanning-animation.active {
            display: block;
        }

        .scanner-ring {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
        }

        .scanner-ring::before,
        .scanner-ring::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: scan 2s linear infinite;
        }

        .scanner-ring::before {
            border-top-color: var(--primary-cyan);
            animation-delay: 0s;
        }

        .scanner-ring::after {
            border-right-color: var(--accent-pink);
            animation-delay: 0.5s;
        }

        @keyframes scan {
            0% {
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
            50% {
                transform: rotate(180deg) scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: rotate(360deg) scale(1);
                opacity: 1;
            }
        }

        .scanning-text {
            font-size: 1.5rem;
            color: var(--primary-cyan);
            font-weight: 600;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Result Cards */
        .result-stage {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(0, 240, 255, 0.05);
            border-left: 4px solid var(--primary-cyan);
            border-radius: 12px;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .result-stage:nth-child(1) { animation-delay: 0.2s; }
        .result-stage:nth-child(2) { animation-delay: 0.4s; }
        .result-stage:nth-child(3) { animation-delay: 0.6s; }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .stage-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--primary-cyan);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .symptom-tag,
        .disease-item {
            display: inline-block;
            padding: 8px 16px;
            margin: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            animation: popIn 0.4s ease forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .symptom-tag:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--primary-cyan);
            transform: translateY(-2px);
        }

        /* Disease Card */
        .disease-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border-left: 3px solid var(--accent-pink);
            transition: all 0.3s ease;
        }

        .disease-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .disease-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .probability-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .probability-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-cyan), var(--accent-pink));
            border-radius: 10px;
            animation: fillBar 1s ease forwards;
            width: 0;
        }

        @keyframes fillBar {
            to {
                width: var(--width);
            }
        }

        .probability-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Medicine List */
        .medicine-list {
            list-style: none;
            padding: 0;
        }

        .medicine-item {
            padding: 12px 20px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, rgba(123, 47, 247, 0.2), transparent);
            border-left: 3px solid var(--accent-purple);
            border-radius: 8px;
            display: flex;
            align-items: center;
            animation: slideInLeft 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .medicine-item::before {
            content: '💊';
            margin-right: 15px;
            font-size: 1.5rem;
        }

        /* Stats Panel */
        .stats-panel {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(123, 47, 247, 0.1));
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-cyan);
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Loading Dots */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-cyan);
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }

            .input-section,
            .results-section {
                min-width: 100%;
            }

            .logo {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .glass-card {
                padding: 25px;
            }

            .logo {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>

    <div class="container">
        <!-- Header -->
        <header>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Input Section -->
            <div class="input-section glass-card">

                <div class="input-group">

        <!-- Stats Panel -->

                <div class="stat-label">Model Accuracy</div>

            <div class="stat-card">

            </div>
            <div class="stat-card">
                <div class="stat-value">30K+</div>
                <div class="stat-label">Training Records</div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:5000/api';

        // Real prediction function using Flask backend
        async function predictFromBackend(age, gender, complaint, duration) {
            try {
                const response = await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        age: age,
                        gender: gender,
                        complaint: complaint,
                        duration: duration
                    })
                });

                if (!response.ok) {
                    throw new Error('Prediction failed');
                }

                const data = await response.json();
                return {
                    symptoms: data.symptoms,
                    diseases: data.diseases,
                    medicines: data.medicines,
                    topDisease: data.top_disease
                };
            } catch (error) {
                console.error('Backend error, using mock data:', error);
                // Fallback to mock data if backend is unavailable
                return predictFromComplaint(complaint);
            }
        }

            let symptoms = [];
            const lowerComplaint = complaint.toLowerCase();
            for (const [keyword, symptomList] of Object.entries(symptomMap)) {
                if (lowerComplaint.includes(keyword)) {
                    symptoms = symptoms.concat(symptomList);
                }
            }
            
            if (symptoms.length === 0) {
                symptoms = ['Fatigue', 'Weakness', 'General Discomfort'];
            }

            symptoms = [...new Set(symptoms)].slice(0, 8);

            // Find diseases
            let diseases = diseasePredictions.default;
            for (const [keyword, diseaseList] of Object.entries(diseasePredictions)) {
                if (lowerComplaint.includes(keyword) && keyword !== 'default') {
                    diseases = diseaseList;
                    break;
                }
            }

            // Get medicines for top disease
            const topDisease = diseases[0].name;
            const recommendedMedicines = medicines[topDisease] || medicines.default;

            return {
                symptoms,
                diseases,
                medicines: recommendedMedicines
            };
        }

        async function startScan() {
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const complaint = document.getElementById('complaint').value;
            const duration = document.getElementById('duration').value;

            // Validation
            if (!age || !gender || !complaint) {
                alert('Please fill in all required fields (Age, Gender, and Chief Complaint)');
                return;
            }

            // Hide initial message
            document.getElementById('initialMessage').style.display = 'none';

            // Show scanning animation
            document.getElementById('scanningAnimation').classList.add('active');
            document.getElementById('resultsPanel').classList.remove('active');

            // Get predictions from backend (or fallback to mock)
            try {
                const results = await predictFromBackend(age, gender, complaint, duration);
                
                // Simulate scan delay for effect
                setTimeout(() => {
                    // Hide scanning
                    document.getElementById('scanningAnimation').classList.remove('active');

                    // Display results
                    displayResults(results);
                }, 3000);
            } catch (error) {
                console.error('Prediction error:', error);
                document.getElementById('scanningAnimation').classList.remove('active');
                alert('An error occurred during prediction. Please try again.');
            }
        }

        function displayResults(results) {
            const resultsContent = document.getElementById('resultsContent');

            let html = '';

            // Stage 1: Symptoms
            html += `
                <div class="result-stage">
                    <div class="stage-title">🔍 Stage 1: Predicted Symptoms</div>
                    <div>
            `;
            results.symptoms.forEach((symptom, index) => {
                html += `<span class="symptom-tag" style="animation-delay: ${index * 0.1}s">${symptom}</span>`;
            });
            html += `</div></div>`;

            // Stage 2: Diseases
            html += `
                <div class="result-stage">
                    <div class="stage-title">🏥 Stage 2: Predicted Diseases</div>
            `;
            results.diseases.forEach((disease, index) => {
                html += `
                    <div class="disease-card" style="animation-delay: ${index * 0.2}s">
                        <div class="disease-name">${disease.name}</div>
                        <div class="probability-bar">
                            <div class="probability-fill" style="--width: ${disease.probability}%"></div>
                        </div>
                        <div class="probability-text">Probability: ${disease.probability}%</div>
                    </div>
                `;
            });
            html += `</div>`;

            // Stage 3: Medicines
            const topDisease = results.topDisease || results.diseases[0].name;
            const topProbability = results.diseases[0].probability;
            
            html += `
                <div class="result-stage">
                    <div class="stage-title">💊 Stage 3: Recommended Treatments</div>
                    <div style="margin-bottom: 15px; color: rgba(255, 255, 255, 0.8);">
                        For <strong style="color: var(--accent-pink);">${topDisease}</strong> 
                        (${topProbability}% probable)
                    </div>
                    <ul class="medicine-list">
            `;
            results.medicines.forEach((medicine, index) => {
                html += `<li class="medicine-item" style="animation-delay: ${index * 0.15}s">${medicine}</li>`;
            });
            html += `
                    </ul>
                </div>
            `;

            // Disclaimer
            html += `
                <div style="margin-top: 30px; padding: 20px; background: rgba(255, 0, 110, 0.1); border-left: 3px solid var(--accent-pink); border-radius: 8px; font-size: 0.9rem; color: rgba(255, 255, 255, 0.7);">
                    ⚠️ <strong>Disclaimer:</strong> This is an AI-powered diagnostic tool for educational purposes only. 
                    Always consult qualified healthcare professionals for medical advice and treatment.
                </div>
            `;

            resultsContent.innerHTML = html;
            document.getElementById('resultsPanel').classList.add('active');
        }
    </script>
</body>
</html>
